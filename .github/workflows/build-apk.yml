name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the app (app.zip uploaded from the phone)
        run: |
          set -e
          test -f app.zip || { echo "::error::app.zip is not in the repository root. Upload it first."; exit 1; }
          rm -rf work && mkdir work && unzip -q app.zip -d work
          P=$(find work -name project.godot -not -path "*/android/*" | head -1)
          test -n "$P" || { echo "::error::project.godot not found inside app.zip"; exit 1; }
          echo "PROJ=$(dirname "$P")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Android SDK pieces Godot 4.3 needs
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313" > /dev/null

      - name: Build the BloxCapture plugin (AAR)
        working-directory: ${{ env.PROJ }}/android_plugin
        run: |
          echo "sdk.dir=$SDK" > local.properties
          gradle --no-daemon :plugin:assembleDebug :plugin:assembleRelease
          mkdir -p ../addons/bloxcapture/bin/debug ../addons/bloxcapture/bin/release
          cp plugin/build/outputs/aar/plugin-debug.aar   ../addons/bloxcapture/bin/debug/BloxCapture-debug.aar
          cp plugin/build/outputs/aar/plugin-release.aar ../addons/bloxcapture/bin/release/BloxCapture-release.aar

      - name: Install Godot and export templates
        run: |
          set -e
          B="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o tpl.tpz   "$B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpl.tpz -d tpl && mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Godot settings, signing key, Android build template
        working-directory: ${{ env.PROJ }}
        run: |
          set -e
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          mkdir -p ~/.config/godot
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '[resource]' \
            "export/android/android_sdk_path = \"$SDK\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$HOME/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' > ~/.config/godot/editor_settings-4.3.tres
          mkdir -p android/build
          unzip -q -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo -n "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Import project and run tests
        working-directory: ${{ env.PROJ }}
        run: |
          godot --headless --path . --import || true
          godot --headless --path . -s tests/run_tests.gd 2>&1 | tail -5
          godot --headless --path . res://tests/smoke.tscn 2>&1 | tail -3

      - name: Export APK
        working-directory: ${{ env.PROJ }}
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/BloxTradeAI.apk 2>&1 | tail -40
          ls -l build/BloxTradeAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BloxTradeAI-apk
          path: ${{ env.PROJ }}/build/BloxTradeAI.apk
