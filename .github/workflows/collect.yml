name: collect-market-data
on:
  schedule:
    - cron: "*/30 * * * *"     # GitHub may delay or skip scheduled runs; the app shows data age
  workflow_dispatch: {}
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Rebuild folders (phone upload flattened them)
        run: |
          mkdir -p backend/collector backend/tests
          cp __init__.py config.py egg.py merge.py parse.py providers.py run.py validate.py backend/collector/
          cp test_collector.py backend/tests/
      - name: Test collector
        working-directory: backend
        run: python -m unittest discover -s tests
      - name: Diagnose live pages (writes a report to the run summary)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          UA = "BloxTradeAI-Collector/1.0 (+https://github.com/${{ github.repository }})"
          out = []
          def get(url):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA}), timeout=20)
                  return r.status, r.read(3000000).decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", "ERR"), str(e)
          for host in ("https://bloxfruitsvalues.gg", "https://eggvalues.com"):
              st, body = get(host + "/robots.txt")
              out.append("## robots.txt " + host + " -> HTTP %s" % st)
              out.append("\n".join(l for l in body.splitlines() if l.lower().startswith(("user-agent", "disallow", "allow", "crawl")))[:600])
          pages = [("https://bloxfruitsvalues.gg/values/rarity/mythical", r"\d+ items"),
                   ("https://eggvalues.com/blox-fruits/values/", r"Physical value")]
          for url, anchor in pages:
              st, body = get(url)
              out.append("\n## " + url + " -> HTTP %s, %d chars" % (st, len(body)))
              out.append("links to /values/: %d | table tags: %d | script tags: %d" % (
                  body.count('href="/values/'), body.count("<table"), body.count("<script")))
              m = re.search(anchor, body)
              start = max(0, (m.start() if m else 0) - 200)
              out.append("--- html around '%s' (%s) ---" % (anchor, "found" if m else "NOT FOUND, showing start"))
              out.append(body[start:start + 600])
              k = body.find('href="/values/', m.end() if m else 0)
              if k >= 0:
                  out.append("--- html of first /values/ link after that (a fruit card?) ---")
                  out.append(body[max(0, k - 300):k + 3500])
          text = "\n".join(out)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Live page diagnostic\n~~~\n" + text + "\n~~~\n")
          PY
      - name: Restore previous published data
        run: git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site || mkdir site
      - name: Collect
        working-directory: backend
        env:
          COLLECTOR_USER_AGENT: "BloxTradeAI-Collector/1.0 (+https://github.com/${{ github.repository }})"
        run: python -m collector.run --out ../site
      - name: Publish (single orphan commit, no history growth)
        working-directory: site
        run: |
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "collector"; git config user.email "collector@users.noreply.github.com"
          git add -A && git commit -qm "data $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
