name: collect-market-data
on:
  schedule:
    - cron: "*/30 * * * *"     # GitHub may delay or skip scheduled runs; the app shows data age
  workflow_dispatch: {}
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Rebuild folders (phone upload flattened them)
        run: |
          mkdir -p backend/collector backend/tests
          cp __init__.py config.py egg.py merge.py parse.py providers.py run.py validate.py backend/collector/
          cp test_collector.py backend/tests/
      - name: Test collector
        working-directory: backend
        run: python -m unittest discover -s tests
      - name: Diagnose live pages (writes a report to the run summary)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os, re, html, time, urllib.request
          UA = "BloxTradeAI-Collector/1.0 (+https://github.com/${{ github.repository }})"
          NAMES = ["Hellfire Gas","Arcsteel Magnet","Starlight Gravity","Runic Fiend Yeti","Lime Blade","Fiend Yeti","Ember Dragon","Meme Fruit","Divine Portal","Galaxy Kitsune","Crimson Kitsune","Werewolf","Torment Pain","Topaz Diamond","Yellow Lightning","Thermite Bomb","Super Spirit Pain","Sadness Pain","Rose Quartz Diamond","Ruby Diamond","Red Lightning","Purple Lightning","Green Lightning","Frustration Pain","Nuclear Bomb","Eagle Requiem","Emerald Diamond","Eagle Glacier","Celestial Pain","Eagle Matrix","Celebration Bomb","Azura Bomb"]
          def get(url):
              time.sleep(2)
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA}), timeout=20)
                  return r.status, r.read(3000000).decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", "ERR"), ""
          def text(b):
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", re.sub(r"(?s)<(script|style).*?</\1>", " ", b)))).lower()
          pages = {"bfv/values": "https://bloxfruitsvalues.gg/values", "egg": "https://eggvalues.com/blox-fruits/values/"}
          for t in ("mythical", "legendary", "rare", "uncommon", "common"):
              pages["bfv/" + t] = "https://bloxfruitsvalues.gg/values/rarity/" + t
          raw, txt, out = {}, {}, []
          for k, u in pages.items():
              st, b = get(u)
              raw[k], txt[k] = b, text(b)
              out.append("%s -> HTTP %s, %d chars" % (k, st, len(b)))
          out.append("\n## Where each requested name appears (page keys)")
          for n in NAMES:
              out.append("%-22s %s" % (n, [k for k in txt if n.lower() in txt[k]] or "NOWHERE"))
          out.append("\n## bloxfruitsvalues.gg /values: distinct links")
          hrefs = sorted(set(re.findall(r'href="(/values[^"#?]*)"', raw["bfv/values"])))
          out.append(" ".join(h for h in hrefs if h.count("/") <= 2)[:1500])
          out.append("\n## eggvalues tables")
          for i, t in enumerate(re.findall(r"(?s)<table.*?</table>", raw["egg"])):
              rows = re.findall(r"(?s)<tr.*?</tr>", t)
              out.append("table %d: %d rows" % (i, len(rows)))
              for r in rows[:3]:
                  out.append("  " + r[:900])
              for n in NAMES:
                  m = [r for r in rows if n.lower() in text(r)]
                  if m:
                      out.append("  >> " + n + ": " + m[0][:700])
          s = "\n".join(out)
          print(s)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Live page diagnostic\n~~~\n" + s + "\n~~~\n")
          PY
      - name: Restore previous published data
        run: git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site || mkdir site
      - name: Collect
        working-directory: backend
        env:
          COLLECTOR_USER_AGENT: "BloxTradeAI-Collector/1.0 (+https://github.com/${{ github.repository }})"
        run: python -m collector.run --out ../site
      - name: Publish (single orphan commit, no history growth)
        working-directory: site
        run: |
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "collector"; git config user.email "collector@users.noreply.github.com"
          git add -A && git commit -qm "data $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
